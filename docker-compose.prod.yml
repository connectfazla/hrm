services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-uppearance}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-uppearance}
      POSTGRES_DB: ${DB_NAME:-uppearance_hrms}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-uppearance}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-uppearance}:${DB_PASSWORD:-uppearance}@postgres:5432/${DB_NAME:-uppearance_hrms}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-7}
      REFRESH_IDLE_TTL_HOURS: ${REFRESH_IDLE_TTL_HOURS:-2}
      FILES_STORAGE_ROOT: /app/storage
      FILES_MASTER_KEY: ${FILES_MASTER_KEY:?set FILES_MASTER_KEY}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      PORT: "4000"
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - api_storage:/app/storage

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api/v1}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

  # Run migrations + seed (one-off, uses build stage which has all deps)
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-uppearance}:${DB_PASSWORD:-uppearance}@postgres:5432/${DB_NAME:-uppearance_hrms}
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed"
    profiles:
      - setup

volumes:
  pg_data:
  api_storage:
