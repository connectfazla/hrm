services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uppearance_hrms
      POSTGRES_USER: uppearance
      POSTGRES_PASSWORD: uppearance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uppearance -d uppearance_hrms"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
